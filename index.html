<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word by word · IELTS Vocabulary</title>
<style>
  :root{
    --navy:#1c2b3a; --navy-deep:#141f2b; --cream:#f3efe6; --cream-soft:#faf7f0;
    --clay:#c98a5e; --line:rgba(28,43,58,0.12);
    --sans:'Segoe UI', system-ui, -apple-system, sans-serif;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);font-family:var(--sans);color:var(--navy);
       display:flex;justify-content:center;padding:28px 16px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .frame{width:100%;max-width:480px;background:var(--cream-soft);border-radius:20px;
    border:1px solid var(--line);box-shadow:0 18px 50px -30px rgba(20,31,43,.55);
    padding:26px 24px 18px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:700}
  h1{font-family:var(--serif);font-size:30px;margin:4px 0 0;font-weight:600;letter-spacing:-.01em}
  .pw{text-align:right;flex-shrink:0}
  .pnum{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
  .pslash{font-size:15px;color:rgba(28,43,58,.4);font-weight:400}
  .plabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,43,58,.5);margin-top:3px}
  .bar{height:5px;background:rgba(28,43,58,.08);border-radius:4px;margin:16px 0 22px;overflow:hidden}
  .barfill{height:100%;background:var(--clay);border-radius:4px;transition:width .4s ease;width:0%}
  .rest{animation:rise .4s ease;text-align:center}
  .lead{font-family:var(--serif);font-size:18px;margin:4px 0 20px;font-style:italic}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
  .tile{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 6px}
  .tnum{font-family:var(--serif);font-size:24px;font-weight:600}
  .tlabel{font-size:10.5px;color:rgba(28,43,58,.55);margin-top:2px}
  .primary{width:100%;padding:15px;background:var(--navy);color:var(--cream);border:none;
    border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .donenote{color:rgba(28,43,58,.6);font-size:14px;padding:10px 0 4px}
  .settingrow{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;align-items:center}
  .slabel{font-size:12.5px;color:rgba(28,43,58,.6)}
  .chips{display:flex;gap:8px}
  .chip{padding:7px 15px;border-radius:9px;border:1px solid var(--line);background:var(--cream-soft);
    color:var(--navy);cursor:pointer;font-size:14px;font-weight:600;font-family:var(--sans)}
  .chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .session{animation:rise .35s ease}
  .stop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .counter{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(28,43,58,.5);font-weight:600}
  .exit{background:none;border:none;color:rgba(28,43,58,.5);font-size:12.5px;cursor:pointer;
    font-family:var(--sans);text-decoration:underline;text-underline-offset:3px}
  .card{background:var(--navy);color:var(--cream);border-radius:16px;min-height:230px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:34px 26px;cursor:pointer;box-shadow:0 20px 40px -26px rgba(20,31,43,.7);user-select:none}
  .word{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
  .wordsm{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--clay);margin-bottom:14px}
  .def{font-size:17px;line-height:1.5;color:var(--cream-soft);max-width:340px}
  .cardfa{margin-top:14px;font-size:17px;font-weight:700;color:var(--clay);direction:rtl}
  .taphint{margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,239,230,.4)}
  .reveal{width:100%;margin-top:14px;padding:14px;background:var(--cream-soft);color:var(--navy);
    border:1px solid var(--line);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .arow{display:flex;gap:10px;margin-top:14px}
  .ans{flex:1;padding:15px;border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--sans);border:none}
  .again{background:var(--cream-soft);color:var(--navy);border:1px solid var(--line)}
  .got{background:var(--clay);color:#fff}
  footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);text-align:center;
    display:flex;justify-content:center;gap:18px}
  .reset,.export{background:none;border:none;color:rgba(28,43,58,.4);font-size:11.5px;cursor:pointer;font-family:var(--sans)}
  .hidden{display:none}
  /* tabs */
  .tabs{display:flex;gap:6px;background:rgba(28,43,58,.06);border-radius:11px;padding:4px;margin-bottom:20px}
  .tab{flex:1;padding:9px;border:none;background:none;border-radius:8px;font-size:13.5px;font-weight:600;
    color:rgba(28,43,58,.55);cursor:pointer;font-family:var(--sans)}
  .tab.on{background:var(--cream-soft);color:var(--navy);box-shadow:0 1px 3px rgba(20,31,43,.12)}
  /* glossary list */
  .listView{animation:rise .35s ease}
  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--cream);
    font-size:14px;font-family:var(--sans);color:var(--navy);margin-bottom:6px;outline:none}
  .search:focus{border-color:var(--clay)}
  .listmeta{font-size:11.5px;color:rgba(28,43,58,.45);margin:0 2px 12px;letter-spacing:.02em}
  .list{max-height:52vh;overflow-y:auto;padding-right:4px}
  .item{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;background:rgba(28,43,58,.18)}
  .dot.learning{background:var(--clay)}
  .dot.learned{background:#4f8a5b}
  .itxt{flex:1;min-width:0}
  .iword{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--navy);line-height:1.25}
  .idef{font-size:13.5px;color:rgba(28,43,58,.68);line-height:1.45;margin-top:2px}
  .ifa{font-size:13px;color:var(--clay);margin-top:3px;font-weight:600;direction:rtl}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;color:rgba(28,43,58,.5)}
  .legend span{display:flex;align-items:center;gap:5px}
  .empty{text-align:center;color:rgba(28,43,58,.45);font-size:14px;padding:30px 0}
  /* review button */
  .review{width:100%;margin-top:10px;padding:13px;background:var(--cream);color:var(--navy);
    border:1px solid var(--line);border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .review:disabled{opacity:.4;cursor:default}
  .review+.review{margin-top:8px}
  /* test view */
  .testView{animation:rise .35s ease}
  .testIntro{text-align:center}
  .qcount{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(28,43,58,.5);font-weight:600;margin-bottom:12px}
  .qdef{background:var(--navy);color:var(--cream);border-radius:16px;padding:26px 22px;font-size:17px;line-height:1.5;
    text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--cream-soft);color:var(--navy);
    font-size:16px;font-weight:600;font-family:var(--serif);cursor:pointer;text-align:left}
  .opt:disabled{cursor:default}
  .opt.correct{background:#e6efe7;border-color:#4f8a5b;color:#2f6138}
  .opt.wrong{background:#f3e3e0;border-color:#c0654f;color:#8f3c2c}
  .nextBtn{width:100%;margin-top:14px;padding:14px;background:var(--navy);color:var(--cream);border:none;
    border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .score{font-family:var(--serif);font-size:44px;font-weight:600;text-align:center;margin:8px 0 2px;color:var(--navy)}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div>
      <div class="kicker">Vocabulary · IELTS</div>
      <h1>Word by word</h1>
    </div>
    <div class="pw" title="Words learned">
      <div class="pnum"><span id="mastered">0</span><span class="pslash">/<span id="total">0</span></span></div>
      <div class="plabel">learned</div>
    </div>
  </header>

  <div class="bar"><div class="barfill" id="barfill"></div></div>

  <div class="tabs" id="tabs">
    <button class="tab on" id="tabStudy">Study</button>
    <button class="tab" id="tabTest">Test</button>
    <button class="tab" id="tabList">All words</button>
  </div>

  <!-- REST VIEW -->
  <div class="rest" id="restView">
    <p class="lead" id="lead">Small and steady. No need to rush.</p>
    <div class="tiles">
      <div class="tile"><div class="tnum" id="tDue">0</div><div class="tlabel">to review</div></div>
      <div class="tile"><div class="tnum" id="tNew">0</div><div class="tlabel">new words</div></div>
    </div>
    <button class="primary" id="startBtn">Start</button>
    <button class="review" id="reviewBtn">Review today's words</button>
    <button class="review" id="reviewAllBtn">Review all learned words</button>
    <div class="donenote hidden" id="doneNote">All caught up. Come back tomorrow for your reviews.</div>
  </div>

  <!-- SESSION VIEW -->
  <div class="session hidden" id="sessionView">
    <div class="stop">
      <span class="counter" id="counter">1 of 10</span>
      <button class="exit" id="exitBtn">Done for now</button>
    </div>
    <div class="card" id="card"></div>
    <button class="reveal" id="revealBtn">Show meaning</button>
    <div class="arow hidden" id="arow">
      <button class="ans again" id="againBtn">Again</button>
      <button class="ans got" id="gotBtn">Got it</button>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div class="listView hidden" id="listView">
    <input class="search" id="search" type="text" placeholder="Search a word or meaning…" autocomplete="off">
    <div class="listmeta" id="listMeta"></div>
    <div class="list" id="list"></div>
    <div class="legend">
      <span><i class="dot"></i>not seen</span>
      <span><i class="dot learning"></i>learning</span>
      <span><i class="dot learned"></i>learned</span>
    </div>
  </div>

  <!-- TEST VIEW -->
  <div class="testView hidden" id="testView"><div id="testBody"></div></div>

  <footer>
    <button class="reset" id="resetBtn">Reset progress</button>
    <button class="export" id="backupBtn">Back up progress</button>
  </footer>
</div>

/* ── spaced repetition (Leitner) ── */
const BOX_INTERVALS=[0,1,2,4,7,15];       // days by box 1..5
const DAY=864e5;
const KEY="ielts-vocab-progress-v1";
const DEFAULT_NEW=10;

function todayStamp(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();}
function blank(){return{cards:{},lastDate:todayStamp(),introducedToday:0,studiedToday:[]};}

let state=blank();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=JSON.parse(raw);
      if(s.lastDate!==todayStamp()){s.introducedToday=0;s.studiedToday=[];s.lastDate=todayStamp();}
      state=Object.assign(blank(),s);
    }
  }catch(e){/* private mode etc — stays in memory */}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ── session ── */
let queue=[],idx=0,flipped=false,doneCount=0;

const $=id=>document.getElementById(id);

function countDue(){const now=todayStamp();let n=0;for(const c of DECK){const p=state.cards[c.w];if(p&&p.due<=now)n++;}return n;}
function countMastered(){let n=0;for(const w in state.cards){if(state.cards[w].box>=5)n++;}return n;}
function countStarted(){return Object.keys(state.cards).length;}
function newLeft(){return DECK.length-countStarted();}   // all unseen words, no daily cap

function renderRest(){
  $("sessionView").classList.add("hidden");
  $("listView").classList.add("hidden");
  $("testView").classList.add("hidden");
  $("restView").classList.remove("hidden");
  setTab("study");
  const due=countDue(),nl=newLeft();
  $("tDue").textContent=due;
  $("tNew").textContent=nl;
  const has=due+nl>0;
  $("lead").textContent=has?"Small and steady. No need to rush.":"You're all caught up for today.";
  $("startBtn").classList.toggle("hidden",!has);
  $("doneNote").classList.toggle("hidden",has);
  if(has)$("startBtn").textContent="Start — "+(due+nl)+" cards";
  const st=(state.studiedToday||[]).length;
  const rb=$("reviewBtn");
  rb.textContent=st?("Review today's words ("+st+")"):"Review today's words";
  rb.disabled=st===0;
  const learnedCount=countMastered();
  const startedCount=countStarted();
  const rab=$("reviewAllBtn");
  rab.textContent=startedCount?("Review all learned words ("+startedCount+")"):"Review all learned words";
  rab.disabled=startedCount===0;
  renderTop();
}
function renderTop(){
  const m=countMastered();
  $("mastered").textContent=m;
  $("total").textContent=DECK.length;
  $("barfill").style.width=(m/DECK.length*100)+"%";
}

function buildSession(){
  const now=todayStamp();
  const due=DECK.filter(c=>{const p=state.cards[c.w];return p&&p.due<=now;}).map(c=>c.w);
  const fresh=DECK.filter(c=>!state.cards[c.w]).map(c=>c.w);
  queue=due.concat(fresh);
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  idx=0;doneCount=0;flipped=false;
  if(queue.length===0){renderRest();return;}
  $("restView").classList.add("hidden");
  $("listView").classList.add("hidden");
  $("testView").classList.add("hidden");
  $("sessionView").classList.remove("hidden");
  renderCard();
}

function renderCard(){
  if(idx>=queue.length){finishSession();return;}
  const c=DECK.find(x=>x.w===queue[idx]);
  $("counter").textContent=(doneCount+1)+" of "+queue.length;
  const card=$("card");
  if(!flipped){
    card.innerHTML='<div class="word"></div><div class="taphint">tap to see the meaning</div>';
    card.querySelector(".word").textContent=c.w;
    $("revealBtn").classList.remove("hidden");
    $("arow").classList.add("hidden");
  }else{
    card.innerHTML='<div class="wordsm"></div><div class="def"></div><div class="cardfa"></div>';
    card.querySelector(".wordsm").textContent=c.w;
    card.querySelector(".def").textContent=c.d;
    card.querySelector(".cardfa").textContent=c.fa||"";
    $("revealBtn").classList.add("hidden");
    $("arow").classList.remove("hidden");
  }
}
function flip(){flipped=!flipped;renderCard();}

function answer(known){
  const word=queue[idx];
  const prev=state.cards[word]||{box:0,due:todayStamp()};
  const wasNew=!state.cards[word];
  if(known){
    const box=Math.min(5,(prev.box||0)+1);
    state.cards[word]={box:box,due:todayStamp()+BOX_INTERVALS[box]*DAY};
  }else{
    state.cards[word]={box:1,due:todayStamp()};
  }
  if(wasNew)state.introducedToday=(state.introducedToday||0)+1;
  if(!state.studiedToday)state.studiedToday=[];
  if(!state.studiedToday.includes(word))state.studiedToday.push(word);
  state.lastDate=todayStamp();
  save();
  doneCount++;
  flipped=false;
  if(!known){
    queue.splice(idx,1);queue.push(word);   // re-queue at end, idx stays
  }else{
    idx++;
  }
  renderTop();
  renderCard();
}

function finishSession(){
  $("card").innerHTML='<div class="word">Nicely done.</div><div class="taphint">session complete</div>';
  $("revealBtn").classList.add("hidden");
  $("arow").classList.add("hidden");
  setTimeout(renderRest,900);
}

/* ── tabs + glossary list ── */
function setTab(which){
  $("tabStudy").classList.toggle("on",which==="study");
  $("tabTest").classList.toggle("on",which==="test");
  $("tabList").classList.toggle("on",which==="list");
}
function statusOf(word){
  const p=state.cards[word];
  if(!p)return"";
  return p.box>=5?"learned":"learning";
}
function renderList(filter){
  const f=(filter||"").trim().toLowerCase();
  const box=$("list");box.innerHTML="";
  let shown=0;
  for(const c of DECK){
    if(f && !(c.w.toLowerCase().includes(f)||c.d.toLowerCase().includes(f)))continue;
    shown++;
    const st=statusOf(c.w);
    const item=document.createElement("div");item.className="item";
    const dot=document.createElement("i");dot.className="dot"+(st?" "+st:"");
    const txt=document.createElement("div");txt.className="itxt";
    const w=document.createElement("div");w.className="iword";w.textContent=c.w;
    const d=document.createElement("div");d.className="idef";d.textContent=c.d;
    const fa=document.createElement("div");fa.className="ifa";fa.textContent=c.fa||"";
    txt.appendChild(w);txt.appendChild(d);txt.appendChild(fa);
    item.appendChild(dot);item.appendChild(txt);
    box.appendChild(item);
  }
  if(shown===0){box.innerHTML='<div class="empty">No words match that search.</div>';}
  const learned=countMastered(),learning=countStarted()-learned;
  $("listMeta").textContent=DECK.length+" words · "+learned+" learned · "+learning+" learning";
}
function openList(){
  $("restView").classList.add("hidden");
  $("sessionView").classList.add("hidden");
  $("testView").classList.add("hidden");
  $("listView").classList.remove("hidden");
  setTab("list");
  renderList($("search").value);
}

/* ── review today's words only (resets daily) ── */
function buildReview(){
  const words=(state.studiedToday||[]).slice();
  if(words.length===0)return;
  queue=words;
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  idx=0;doneCount=0;flipped=false;
  $("restView").classList.add("hidden");
  $("listView").classList.add("hidden");
  $("testView").classList.add("hidden");
  $("sessionView").classList.remove("hidden");
  renderCard();
}

/* ── review all words studied so far (any day) ── */
function buildReviewAll(){
  const words=Object.keys(state.cards);
  if(words.length===0)return;
  queue=words.slice();
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  idx=0;doneCount=0;flipped=false;
  $("restView").classList.add("hidden");
  $("listView").classList.add("hidden");
  $("testView").classList.add("hidden");
  $("sessionView").classList.remove("hidden");
  renderCard();
}

let tQ=[],tqi=0,tScore=0;
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function openTest(){
  $("restView").classList.add("hidden");
  $("sessionView").classList.add("hidden");
  $("listView").classList.add("hidden");
  $("testView").classList.remove("hidden");
  setTab("test");
  renderTestIntro();
}
function testPoolSize(){const s=Object.keys(state.cards).length;return s>=4?s:DECK.length;}
function renderTestIntro(){
  const n=Math.min(10,testPoolSize());
  $("testBody").innerHTML='<div class="testIntro"><p class="lead">Read the meaning, pick the right word.</p>'
    +'<button class="primary" id="startTestBtn">Start test — '+n+' questions</button></div>';
  $("startTestBtn").onclick=()=>startTest(n);
}
function startTest(n){
  const started=Object.keys(state.cards).map(w=>DECK.find(c=>c.w===w)).filter(Boolean);
  let pool=(started.length>=4?started:DECK).slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const picks=pool.slice(0,n);
  tQ=picks.map(correct=>{
    const opts=[correct.w];
    let guard=0;
    while(opts.length<4&&guard++<200){
      const r=DECK[Math.floor(Math.random()*DECK.length)].w;
      if(!opts.includes(r))opts.push(r);
    }
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    return{def:correct.d,answer:correct.w,opts:opts};
  });
  tqi=0;tScore=0;renderTestQ();
}
function renderTestQ(){
  const q=tQ[tqi];
  let html='<div class="qcount">Question '+(tqi+1)+' of '+tQ.length+'</div>';
  html+='<div class="qdef">'+escapeHtml(q.def)+'</div><div class="opts">';
  q.opts.forEach(o=>{html+='<button class="opt" data-w="'+encodeURIComponent(o)+'">'+escapeHtml(o)+'</button>';});
  html+='</div>';
  $("testBody").innerHTML=html;
  document.querySelectorAll("#testBody .opt").forEach(b=>{
    b.onclick=()=>pickAnswer(b,decodeURIComponent(b.dataset.w),q.answer);
  });
}
function pickAnswer(btn,chosen,answer){
  document.querySelectorAll("#testBody .opt").forEach(b=>{
    b.disabled=true;
    const w=decodeURIComponent(b.dataset.w);
    if(w===answer)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
  });
  if(chosen===answer)tScore++;
  const nb=document.createElement("button");
  nb.className="nextBtn";
  nb.textContent=(tqi+1<tQ.length)?"Next":"See result";
  nb.onclick=()=>{tqi++;if(tqi<tQ.length)renderTestQ();else renderTestResult();};
  $("testBody").appendChild(nb);
}
function resultMsg(r){
  if(r>=0.9)return"Excellent.";
  if(r>=0.7)return"Solid work.";
  if(r>=0.5)return"Getting there.";
  return"Keep going — review and try again.";
}
function renderTestResult(){
  const r=tScore/tQ.length;
  $("testBody").innerHTML='<div class="testIntro"><div class="score">'+tScore+'/'+tQ.length+'</div>'
    +'<p class="lead">'+resultMsg(r)+'</p>'
    +'<button class="primary" id="retryTest">Try again</button></div>';
  $("retryTest").onclick=renderTestIntro;
}

/* ── backup / restore ── */
function backup(){
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="vocab-progress-backup.json";
  a.click();
}

/* ── wire up ── */
$("startBtn").onclick=buildSession;
$("card").onclick=flip;
$("revealBtn").onclick=()=>{flipped=true;renderCard();};
$("againBtn").onclick=()=>answer(false);
$("gotBtn").onclick=()=>answer(true);
$("exitBtn").onclick=renderRest;
$("tabStudy").onclick=renderRest;
$("tabTest").onclick=openTest;
$("tabList").onclick=openList;
$("reviewBtn").onclick=buildReview;
$("reviewAllBtn").onclick=buildReviewAll;
$("search").oninput=e=>renderList(e.target.value);
$("resetBtn").onclick=()=>{if(confirm("Reset all progress?")){state=blank();save();renderRest();}};
$("backupBtn").onclick=backup;
document.addEventListener("keydown",e=>{
  if($("sessionView").classList.contains("hidden"))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(flipped)return;flip();}
  if(flipped&&(e.key==="1"||e.key.toLowerCase()==="a"))answer(false);
  if(flipped&&(e.key==="2"||e.key.toLowerCase()==="g"))answer(true);
});

load();
renderRest();
</script>
